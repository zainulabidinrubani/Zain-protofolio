<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#050507" />
<title>Zain Ul Abidin — Gen AI & ML Engineer</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />

<!--
=============================================================================
 HOW TO EDIT
 1. Scroll to the <script> at the bottom → "EDIT YOUR CONTENT HERE".
 2. Change text inside PROFILE, SKILLS, PROJECTS, EXPERIENCE, CREDENTIALS.
 3. To ADD an item: copy one { ... }, paste it after a comma. To REMOVE: delete it.
    Layout, counts, and navigation adjust automatically.
 4. Empty links ("") are hidden. Empty sections hide themselves.
 5. Colors: edit the variables in :root below.
=============================================================================
-->
<style>
:root{
  --bg:#050507;          /* page black */
  --surface:#0d0d12;     /* cards */
  --line:#1f1d2b;        /* borders */
  --text:#ecebf5;        /* main text */
  --muted:#8d8aa3;       /* secondary text */
  --accent:#c4b5fd;      /* light purple */
  --accent-2:#a78bfa;    /* deeper purple for gradients */
  --glow:196,181,253;    /* accent as r,g,b for glows */
  --head:'Sora',sans-serif;
  --body:'DM Sans',sans-serif;
  --glow2:167,139,250; --on:#09090d; --nav:rgba(5,5,7,.68);
  --grid:rgba(196,181,253,.07); --aurora:.2; --grad-end:#fff;
}
/* LIGHT MODE — edit these to restyle the light theme */
[data-theme="light"]{
  --bg:#f8f6ff; --surface:#ffffff; --line:#e3dcfa; --text:#17142b; --muted:#645f82;
  --accent:#7c3aed; --accent-2:#a78bfa; --glow:124,58,237; --glow2:167,139,250;
  --on:#ffffff; --nav:rgba(248,246,255,.75); --grid:rgba(124,58,237,.09); --aurora:.3; --grad-end:#4c1d95;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{transition:background .4s,color .4s;background:var(--bg);color:var(--text);font:400 17px/1.65 var(--body);overflow-x:hidden}
a{color:inherit;text-decoration:none}
h1,h2,h3{font-family:var(--head);line-height:1.1;letter-spacing:-.02em}
::selection{background:var(--accent);color:var(--on)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* ---------- custom cursor (only on mouse devices) ---------- */
@media (hover:hover) and (pointer:fine){
  html,body,a,button,input,textarea,*{cursor:none !important}
}
#glow{position:fixed;left:0;top:0;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;
  background:radial-gradient(circle,rgba(var(--glow),.22) 0%,rgba(var(--glow2),.10) 40%,transparent 70%);
  filter:blur(24px);pointer-events:none;z-index:1;will-change:transform}
#splash{position:fixed;inset:0;pointer-events:none;z-index:2}
#dot,#ring{position:fixed;left:0;top:0;pointer-events:none;z-index:9999;border-radius:50%;will-change:transform}
#dot{width:8px;height:8px;margin:-4px 0 0 -4px;background:var(--accent)}
#ring{width:38px;height:38px;margin:-19px 0 0 -19px;border:1.5px solid rgba(var(--glow),.7);
  transition:width .25s,height .25s,margin .25s,background .25s,border-color .25s}
#ring.hover{width:66px;height:66px;margin:-33px 0 0 -33px;background:rgba(var(--glow),.12);border-color:var(--accent)}
#ring.down{width:26px;height:26px;margin:-13px 0 0 -13px}
body.touch #dot,body.touch #ring,body.touch #glow,body.touch #splash{display:none}

/* ---------- layout ---------- */
main,header,footer{position:relative;z-index:3}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
section{padding:110px 0}
.sec-head{display:flex;align-items:baseline;gap:18px;margin-bottom:48px}
.sec-head h2{font-size:clamp(30px,5vw,48px)}
.sec-head .count{color:var(--accent);font:600 15px var(--head)}
.sec-head::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}

/* nav */
nav{position:fixed;top:0;left:0;right:0;z-index:50;backdrop-filter:blur(14px);background:var(--nav);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;justify-content:space-between;align-items:center;height:68px}
.logo{font:800 20px var(--head);color:var(--accent)}
.logo{letter-spacing:-.03em}
#menu{display:flex;gap:6px;list-style:none;padding:0}
#menu a{display:block;color:var(--muted);font-size:15px;padding:8px 16px;border-radius:999px;transition:.2s}
#menu a:hover{color:var(--text)}
#menu a.active{color:var(--accent);background:rgba(var(--glow),.12)}
.navr{display:flex;gap:10px;align-items:center}
.ic-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--accent);font-size:17px;display:grid;place-items:center;transition:.25s}
.ic-btn:hover{border-color:var(--accent);box-shadow:0 0 22px rgba(var(--glow),.35)}
.burger{display:none}
@media(max-width:820px){
  .burger{display:grid}
  #menu{position:absolute;top:68px;left:0;right:0;flex-direction:column;background:var(--nav);backdrop-filter:blur(16px);padding:14px 24px 20px;border-bottom:1px solid var(--line);display:none}
  nav.open #menu{display:flex}
}
/* background layer */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(ellipse 85% 65% at 50% 0%,#000 25%,transparent 80%);mask-image:radial-gradient(ellipse 85% 65% at 50% 0%,#000 25%,transparent 80%)}
.bg i{position:absolute;border-radius:50%;filter:blur(110px);opacity:var(--aurora);animation:float 18s ease-in-out infinite alternate}
.bg i:nth-child(1){width:560px;height:560px;left:-140px;top:-180px;background:rgb(var(--glow2))}
.bg i:nth-child(2){width:480px;height:480px;right:-160px;top:35%;background:rgb(var(--glow));animation-delay:-8s}
@keyframes float{to{transform:translate(60px,70px) scale(1.15)}}
@media(prefers-reduced-motion:reduce){.bg i,.track{animation:none}}
/* hero */
.pill{display:inline-flex;align-items:center;gap:10px;padding:7px 16px;border:1px solid var(--line);background:var(--surface);border-radius:999px;font-size:14px;color:var(--muted);margin-bottom:26px}
.pill i{width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 4px rgba(74,222,128,.18)}
.hero-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:48px;align-items:center}
@media(max-width:900px){.hero-grid{grid-template-columns:1fr}}
.hero-card{background:linear-gradient(160deg,rgba(var(--glow),.14),transparent 60%),var(--surface);border:1px solid var(--line);border-radius:24px;padding:32px;display:flex;flex-direction:column;gap:12px;backdrop-filter:blur(8px);box-shadow:0 30px 80px -40px rgba(var(--glow),.55)}
.hero-card small{color:var(--accent);font:600 14px var(--head)}
.hero-card h3{font-size:24px}.hero-card .co{color:var(--muted)}
.marquee{overflow:hidden;margin-top:70px;border-block:1px solid var(--line);padding:16px 0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.track{display:flex;width:max-content;animation:slide 32s linear infinite}
.track span{font:600 18px var(--head);color:var(--muted);padding-right:48px;white-space:nowrap}
.track span::before{content:"✦";color:var(--accent);margin-right:48px}
@keyframes slide{to{transform:translateX(-25%)}}

/* hero */
.hero{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:110px 0 40px}
.hero h1{font-size:clamp(46px,8vw,104px);font-weight:800;max-width:9ch}
.hero h1 span{background:linear-gradient(120deg,var(--accent),var(--accent-2) 60%,var(--grad-end));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .role{margin:22px 0 10px;font:600 clamp(18px,2.4vw,26px) var(--head);color:var(--accent)}
.hero p.tag{color:var(--muted);max-width:52ch}
.btns{display:flex;gap:14px;margin-top:36px;flex-wrap:wrap}
.btn{padding:14px 28px;border-radius:999px;border:1px solid var(--accent);font:600 15px var(--head);transition:.25s}
.btn.fill{background:var(--accent);color:var(--on)}.btn.sm{padding:9px 20px;font-size:14px}
.btn:hover{background:var(--accent-2);border-color:var(--accent-2);color:var(--on);box-shadow:0 0 36px rgba(var(--glow),.45)}

/* about */
.about p{font-size:clamp(19px,2.3vw,26px);max-width:34em;color:var(--text)}
.facts{display:flex;gap:30px;margin-top:30px;color:var(--muted);flex-wrap:wrap}
.facts a:hover{color:var(--accent)}

/* cards */
.grid{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:30px;display:flex;flex-direction:column;gap:14px;
  transition:transform .3s,border-color .3s,box-shadow .3s}
.card:hover{transform:translateY(-6px);border-color:rgba(var(--glow),.55);box-shadow:0 18px 50px -20px rgba(var(--glow),.4)}
.card h3{font-size:21px}
.card p{color:var(--muted);font-size:16px;flex:1}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tags span{font-size:13px;padding:4px 12px;border-radius:999px;background:rgba(var(--glow),.1);color:var(--accent)}
.links{display:flex;gap:18px;font:600 14px var(--head);margin-top:6px}
.links a{color:var(--accent);border-bottom:1px solid transparent}
.links a:hover{border-color:var(--accent)}
.pnum{font:600 14px var(--head);color:var(--accent-2)}

/* skills */
.skill{margin-bottom:22px}
.skill .row{display:flex;justify-content:space-between;margin-bottom:8px;font:600 15px var(--head)}
.skill .row em{font-style:normal;color:var(--accent)}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--accent-2),var(--accent));transition:width 1.3s cubic-bezier(.2,.7,.2,1)}
.skills-grid{display:grid;gap:8px 60px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}

/* timeline */
.tl{border-left:1px solid var(--line);padding-left:34px;display:grid;gap:36px}
.tl-item{position:relative}
.tl-item::before{content:"";position:absolute;left:-41px;top:8px;width:13px;height:13px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 5px rgba(var(--glow),.15),0 0 20px rgba(var(--glow),.7)}
.tl-item small{color:var(--accent);font:600 14px var(--head)}
.tl-item h3{font-size:22px;margin:6px 0 2px}
.tl-item .co{color:var(--muted)}
.tl-item p{margin-top:8px;max-width:60ch}

/* credentials */
.cred{flex-direction:row;align-items:center;gap:18px;padding:22px 26px}
.cred .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:rgba(var(--glow),.12);color:var(--accent);font-size:22px;flex:none}
.cred h3{font-size:17px}
.cred small{color:var(--muted);text-transform:capitalize}

/* contact */
.contact{text-align:center}
.contact h2{font-size:clamp(34px,7vw,76px);margin-bottom:22px}
.contact .mail{display:inline-block;font:600 clamp(18px,3vw,28px) var(--head);color:var(--accent);border-bottom:2px solid var(--accent);padding-bottom:4px}
.contact .btns{justify-content:center}
footer{padding:34px 0;border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:14px}

/* reveal */
.rv{opacity:0;transform:translateY(26px);transition:opacity .7s,transform .7s}
.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){*{transition:none !important}.rv{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="bg"><i></i><i></i></div><div id="glow"></div><canvas id="splash"></canvas><div id="ring"></div><div id="dot"></div>

<nav id="nav"><div class="wrap"><a href="#top" class="logo" id="logo"></a><ul id="menu"></ul><div class="navr"><button class="ic-btn" id="theme"></button><a class="btn fill sm" href="#contact">Hire me</a><button class="ic-btn burger" id="burger" aria-label="Menu">☰</button></div></div></nav>

<header id="top" class="hero"><div class="wrap hero-grid">
  <div>
    <div class="pill"><i></i><span id="h-status"></span></div>
    <h1 id="h-name"></h1>
    <div class="role" id="h-title"></div>
    <p class="tag" id="h-tag"></p>
    <div class="btns" id="h-btns"></div>
  </div>
  <aside class="hero-card" id="h-card"></aside>
</div>
<div class="marquee"><div class="track" id="marquee"></div></div></header>

<main>
  <section id="about"><div class="wrap about rv">
    <div class="sec-head"><h2>About</h2></div>
    <p id="bio"></p><div class="facts" id="facts"></div>
  </div></section>

  <section id="projects"><div class="wrap">
    <div class="sec-head rv"><h2>Projects</h2></div>
    <div class="grid" id="projects-grid"></div>
  </div></section>

  <section id="skills"><div class="wrap">
    <div class="sec-head rv"><h2>Skills</h2></div>
    <div class="skills-grid rv" id="skills-grid"></div>
  </div></section>

  <section id="experience"><div class="wrap">
    <div class="sec-head rv"><h2>Experience</h2></div>
    <div class="tl" id="tl"></div>
  </div></section>

  <section id="credentials"><div class="wrap">
    <div class="sec-head rv"><h2>Credentials</h2></div>
    <div class="grid" id="cred-grid"></div>
  </div></section>

  <section id="contact"><div class="wrap contact rv">
    <h2>Let's build something.</h2>
    <a class="mail" id="mail"></a>
    <div class="btns" id="social"></div>
  </div></section>
</main>
<footer><div class="wrap" id="foot"></div></footer>

<script>
/* =========================================================================
   EDIT YOUR CONTENT HERE — add / remove / change anything, page adapts.
   ========================================================================= */
const PROFILE = {
  name:     "Zain Ul Abidin",
  title:    "Gen AI & ML Engineer",
  status:   "Available for new AI & ML projects",
  tagline:  "I build LLM agents, RAG chatbots and vision models that hold up in real products.",
  bio:      "I'm a Gen AI & ML engineer who turns messy data and rough ideas into working systems: retrieval pipelines, tool-using agents and computer-vision models. I care about the parts that make them dependable in production, like clean APIs, fast responses and honest evaluation.",
  location: "Kasur, Pakistan",
  email:    "fiverrzain03@gmail.com",
  github:   "https://github.com/zainulabidinrubani",
  linkedin: "https://www.linkedin.com/in/zain-ul-abidin-rubani"
};

const SKILLS = [
  { name: "Python",          level: 80 },
  { name: "TensorFlow",      level: 82 },
  { name: "Scikit-learn",    level: 88 },
  { name: "LLMs & RAG",      level: 85 },
  { name: "Computer Vision", level: 50 },
  { name: "NLP",             level: 60 }
];

const PROJECTS = [
  {
    title: "Leave Agent",
    description: "LLM-powered chatbot agent that checks an employee's leave balance, emails the manager and updates the balance.",
    tech: ["Python", "LangChain", "FastAPI", "Groq", "Supabase"],
    demoUrl: "https://leaveagent-kbgi8x2x0-ai-3a7e.vercel.app/",
    codeUrl: "https://github.com/zainulabidinrubani/Leave-Agent"
  },
  {
    title: "Movie Recommendation Engine with Chatbot",
    description: "LLM-powered assistant that answers movie questions, finds movies with descriptions, and recommends titles using NLP.",
    tech: ["NLP", "LangChain", "Groq", "Serper", "TMDB"],
    demoUrl: "https://movie-dekh.onrender.com/",
    codeUrl: "https://github.com/zainulabidinrubani/Movie_dekh"
  },
  {
    title: "Helmet Detection",
    description: "Deep learning model that detects helmets in images and on a live webcam feed using OpenCV.",
    tech: ["Scikit-learn", "OpenCV", "Python", "MobileNetV3"],
    demoUrl: "https://www.linkedin.com/feed/update/urn:li:activity:7505450916201021440/",
    codeUrl: "https://github.com/zainulabidinrubani/Helemet_detection"
  },
  {
    title: "Restaurant RAG Chatbot",
    description: "RAG-based chatbot that gives restaurant information and helps customers choose from the menu.",
    tech: ["RAG", "LangChain", "FastAPI", "Python"],
    demoUrl: "",   // empty = button hidden
    codeUrl: "https://github.com/zainulabidinrubani/Brim-Burgers"
  }
];

const EXPERIENCE = [
  {
    role: "Gen AI / ML Engineer (Intern)",
    company: "ECS",
    period: "2026 — Present",
    details: "Building real-world projects with RAG systems and AI agents."
  }
];

const CREDENTIALS = [
  { title: "AI Engineer",           type: "certification", year: "2026" },
  { title: "C++",                   type: "certification", year: "2025" },
  { title: "AI Prompt Engineering", type: "certification", year: "2025" }
];

/* Icons per credential type (add your own types here) */
const ICONS = { certification:"✦", award:"★", publication:"✎" };

/* =========================================================================
   RENDERING — you normally don't need to edit below this line.
   ========================================================================= */
const $ = (s,r=document)=>r.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const link = (u,t)=> u ? `<a href="${esc(u)}" target="_blank" rel="noopener">${t}</a>` : "";

function render(){
  const P = PROFILE, first = P.name.split(" ")[0];
  document.title = `${P.name} — ${P.title}`;
  $("#logo").textContent = first + ".";
  $("#h-name").innerHTML = `${esc(first)} <span>${esc(P.name.split(" ").slice(1).join(" "))}</span>`;
  $("#h-title").textContent = P.title.trim();
  $("#h-tag").textContent = P.tagline;
  $("#h-btns").innerHTML = `<a class="btn fill" href="#projects">View projects</a><a class="btn" href="#contact">Get in touch</a>`;
  $("#bio").textContent = P.bio;
  $("#facts").innerHTML = [P.location&&`<span>${esc(P.location)}</span>`, link(P.github,"GitHub"), link(P.linkedin,"LinkedIn")].filter(Boolean).join("");

  // sections: hide empty ones and build the nav from what exists
  const sections = [
    ["about",true,"About"], ["projects",PROJECTS.length,"Projects"], ["skills",SKILLS.length,"Skills"],
    ["experience",EXPERIENCE.length,"Experience"], ["credentials",CREDENTIALS.length,"Credentials"], ["contact",true,"Contact"]
  ];
  sections.forEach(([id,on])=>{ if(!on) $("#"+id).remove(); });
  $("#menu").innerHTML = sections.filter(s=>s[1]).map(([id,,l])=>`<li><a href="#${id}">${l}</a></li>`).join("");

  $("#h-status").textContent = P.status || "Available for new projects";
  const E = EXPERIENCE[0], card = $("#h-card");
  if(E) card.innerHTML = `<small>Currently</small><h3>${esc(E.role)}</h3><div class="co">${esc(E.company)} · ${esc(E.period)}</div><p>${esc(E.details)}</p><div class="tags">${SKILLS.slice(0,4).map(k=>`<span>${esc(k.name)}</span>`).join("")}</div>`; else card.remove();
  const chips = SKILLS.map(k=>`<span>${esc(k.name)}</span>`).join("");
  $("#marquee").innerHTML = chips+chips+chips+chips;


  $("#projects-grid").innerHTML = PROJECTS.map((p,i)=>`
    <article class="card rv"><span class="pnum">${pad(i+1)}</span><h3>${esc(p.title)}</h3><p>${esc(p.description)}</p>
    <div class="tags">${(p.tech||[]).map(t=>`<span>${esc(t)}</span>`).join("")}</div>
    <div class="links">${link(p.demoUrl,"Live demo")}${link(p.codeUrl,"Source code")}</div></article>`).join("");

  $("#skills-grid").innerHTML = SKILLS.map(s=>`
    <div class="skill"><div class="row"><span>${esc(s.name)}</span><em>${+s.level}%</em></div>
    <div class="bar"><i data-w="${+s.level}"></i></div></div>`).join("");

  $("#tl").innerHTML = EXPERIENCE.map(e=>`
    <div class="tl-item rv"><small>${esc(e.period)}</small><h3>${esc(e.role)}</h3><div class="co">${esc(e.company)}</div><p>${esc(e.details)}</p></div>`).join("");

  $("#cred-grid").innerHTML = CREDENTIALS.map(c=>`
    <div class="card cred rv"><div class="ic">${ICONS[c.type]||"✦"}</div><div><h3>${esc(c.title)}</h3><small>${esc(c.type)} · ${esc(c.year)}</small></div></div>`).join("");

  const m = $("#mail"); if(P.email){ m.href="mailto:"+P.email; m.textContent=P.email; } else m.remove();
  $("#social").innerHTML = [link(P.github,"GitHub"),link(P.linkedin,"LinkedIn")].filter(Boolean).map(a=>a.replace("<a ",'<a class="btn" ')).join("");
  $("#foot").textContent = `© ${new Date().getFullYear()} ${P.name}`;
}

/* scroll reveal + skill bars + active nav */
function motion(){
  const io = new IntersectionObserver(es=>es.forEach(e=>{
    if(!e.isIntersecting) return;
    e.target.classList.add("in");
    e.target.querySelectorAll?.(".bar i").forEach(b=>b.style.width=b.dataset.w+"%");
    io.unobserve(e.target);
  }),{threshold:.15});
  document.querySelectorAll(".rv").forEach(el=>io.observe(el));

  const links = [...document.querySelectorAll("#menu a")];
  const so = new IntersectionObserver(es=>es.forEach(e=>{
    if(e.isIntersecting) links.forEach(a=>a.classList.toggle("active",a.getAttribute("href")==="#"+e.target.id));
  }),{rootMargin:"-45% 0px -50% 0px"});
  document.querySelectorAll("main section").forEach(s=>so.observe(s));
}

/* custom cursor + gradient glow + splash trail */
function cursor(){
  if(!matchMedia("(hover:hover) and (pointer:fine)").matches){ document.body.classList.add("touch"); return; }
  const dot=$("#dot"), ring=$("#ring"), glow=$("#glow"), cv=$("#splash"), cx=cv.getContext("2d");
  let W,H; const fit=()=>{W=cv.width=innerWidth;H=cv.height=innerHeight}; fit(); addEventListener("resize",fit);
  let mx=innerWidth/2,my=innerHeight/2, rx=mx,ry=my, gx=mx,gy=my, lx=mx,ly=my;
  const parts=[]; let c1,c2,blend;
  const sync=()=>{const cs=getComputedStyle(document.documentElement);c1=cs.getPropertyValue("--glow").trim();c2=cs.getPropertyValue("--glow2").trim();blend=document.documentElement.dataset.theme==="light"?"source-over":"lighter"};
  sync(); addEventListener("themechange",sync);
  addEventListener("mousemove",e=>{
    mx=e.clientX; my=e.clientY;
    const d=Math.hypot(mx-lx,my-ly); lx=mx; ly=my;
    for(let i=0;i<Math.min(4,1+d/14);i++) parts.push({x:mx,y:my,vx:(Math.random()-.5)*2.4,vy:(Math.random()-.5)*2.4,r:10+Math.random()*26,life:1,h:Math.random()});
    const t=e.target.closest("a,button,.card"); ring.classList.toggle("hover",!!t);
  });
  addEventListener("mousedown",()=>ring.classList.add("down"));
  addEventListener("mouseup",()=>ring.classList.remove("down"));
  document.addEventListener("mouseleave",()=>{dot.style.opacity=ring.style.opacity=0});
  document.addEventListener("mouseenter",()=>{dot.style.opacity=ring.style.opacity=1});
  (function loop(){
    rx+=(mx-rx)*.16; ry+=(my-ry)*.16; gx+=(mx-gx)*.07; gy+=(my-gy)*.07;
    dot.style.transform=`translate(${mx}px,${my}px)`;
    ring.style.transform=`translate(${rx}px,${ry}px)`;
    glow.style.transform=`translate(${gx}px,${gy}px)`;
    cx.clearRect(0,0,W,H); cx.globalCompositeOperation=blend;
    for(let i=parts.length-1;i>=0;i--){
      const p=parts[i]; p.x+=p.vx; p.y+=p.vy; p.life-=.03; p.r*=.985;
      if(p.life<=0){parts.splice(i,1);continue}
      const g=cx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);
      const c=p.h>.5?c1:c2;
      g.addColorStop(0,`rgba(${c},${.35*p.life})`); g.addColorStop(1,`rgba(${c},0)`);
      cx.fillStyle=g; cx.beginPath(); cx.arc(p.x,p.y,p.r,0,7); cx.fill();
    }
    requestAnimationFrame(loop);
  })();
}

function theme(){
  const root=document.documentElement, btn=$("#theme");
  const set=t=>{root.dataset.theme=t;btn.textContent=t==="dark"?"☀":"☾";btn.setAttribute("aria-label","Switch to "+(t==="dark"?"light":"dark")+" mode");
    try{localStorage.setItem("theme",t)}catch(e){} dispatchEvent(new Event("themechange"))};
  let saved=null; try{saved=localStorage.getItem("theme")}catch(e){}
  set(saved||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"));
  btn.onclick=()=>set(root.dataset.theme==="dark"?"light":"dark");
  $("#burger").onclick=()=>$("#nav").classList.toggle("open");
  document.querySelectorAll("#menu a").forEach(a=>a.onclick=()=>$("#nav").classList.remove("open"));
}
render(); theme(); motion(); cursor();
</script>
